<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Predicciones · Polla Mundial 2026</title>
<link rel="stylesheet" href="css/style.css">
</head><body>
<div class="hero" style="padding:22px">
  <h1 style="font-size:1.5rem">✏️ Mis Predicciones</h1>
  <p class="sub" id="heroName">Cargando...</p>
</div>
<nav>
  <a href="#" onclick="logout()" style="color:var(--gray);font-size:.8rem">🚪 Salir</a>
  <a href="index.html">🏠 Inicio</a>
  <a href="predictions.html" class="active">✏️ Predicciones</a>
  <a href="bracket.html">🔱 Bracket</a>
  <a href="leaderboard.html">🏆 Tabla</a>
  <a href="rules.html">📋 Reglas</a>
</nav>
<div class="container">
  <div id="noAuth" style="display:none">
    <div class="card text-center"><p class="text-gray">Debes registrarte primero</p><a href="index.html" class="btn btn-primary mt-16">Ir al inicio →</a></div>
  </div>
  <div id="mainContent" style="display:none">
    <div class="alert alert-info" id="phaseAlert"></div>
    <div id="saveMsg"></div>
    <div id="matchesContainer"></div>
    <button class="btn btn-gold btn-block" onclick="saveAll()" id="saveBtn">💾 Guardar predicciones</button>
    <p class="text-gray text-center mt-8" style="font-size:.78rem">Puedes guardar varias veces antes del cierre · El bracket se calcula automáticamente</p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/data.js"></script>
<script src="js/db.js"></script>
<script>
let participant=null, existing={}, phase=1;

window.addEventListener('DOMContentLoaded',async()=>{
  const saved=localStorage.getItem('polla_p');
  if(!saved){document.getElementById('noAuth').style.display='block';return;}
  participant=JSON.parse(saved);
  document.getElementById('heroName').textContent=participant.name;
  document.getElementById('mainContent').style.display='block';
  const settings=await dbGetSettings();
  phase=settings.phase||1;
  window._settings=settings;
  const alertEl=document.getElementById('phaseAlert');
  const locked = phase===1 ? (settings.phase1_locked||false) : (settings.phase2_locked||false);
  if(locked){
    alertEl.className='alert alert-error';
    alertEl.textContent='🔒 Fase '+phase+' bloqueada — Las predicciones están cerradas. Ya no puedes hacer cambios.';
    document.getElementById('saveBtn').disabled=true;
    document.getElementById('saveBtn').textContent='🔒 Predicciones cerradas';
  } else if(phase===1){
    alertEl.textContent='⏰ Fase 1 — Predice los 72 partidos de grupos. Cierra el 11 Jun antes del primer partido.';
  } else {
    alertEl.className='alert alert-warn';
    alertEl.textContent='🔄 Fase 2 — Puedes actualizar predicciones de grupos con penalización.';
  }
  try{
    const preds=await dbGetPredictions(participant.id);
    preds.forEach(p=>{existing[p.match_id]={home:p.home_score,away:p.away_score};});
  }catch(e){}
  renderMatches();
});

function renderMatches(){
  const c=document.getElementById('matchesContainer');
  const byGroup={};
  GROUP_MATCHES.forEach(m=>{if(!byGroup[m.group])byGroup[m.group]=[];byGroup[m.group].push(m);});
  let html='';
  Object.entries(byGroup).forEach(([grp,matches])=>{
    html+=`<div class="grp-hdr g${grp}" style="background:var(--bg2);color:var(--white)"><span class="grp g${grp}">${grp}</span>Grupo ${grp}</div>`;
    matches.forEach(m=>{
      const ex=existing[m.id]||{};
      const hv=ex.home!==undefined&&ex.home!==null?ex.home:'';
      const av=ex.away!==undefined&&ex.away!==null?ex.away:'';
      html+=`
      <div class="match-meta">${m.date} · ${m.time} ET · ${m.venue}</div>
      <div class="match-row">
        <div class="team-name home">${m.home}</div>
        <div class="goal-input"><input type="number" min="0" max="20" id="h${m.id}" value="${hv}" placeholder="—"></div>
        <div class="vs-sep">—</div>
        <div class="goal-input"><input type="number" min="0" max="20" id="a${m.id}" value="${av}" placeholder="—"></div>
        <div class="team-name away">${m.away}</div>
      </div>`;
    });
  });
  c.innerHTML=html;
}

async function saveAll(){
  const btn=document.getElementById('saveBtn');
  btn.disabled=true;btn.textContent='Guardando...';
  try{
    const preds=GROUP_MATCHES.map(m=>{
      const h=document.getElementById('h'+m.id)?.value;
      const a=document.getElementById('a'+m.id)?.value;
      if(h===''||a===''||h===null||a===null)return null;
      const hi=parseInt(h),ai=parseInt(a);
      if(isNaN(hi)||isNaN(ai))return null;
      return{match_id:m.id,home_score:hi,away_score:ai,phase:1};
    }).filter(Boolean);
    await dbSavePredictions(participant.id,preds);
    const total=GROUP_MATCHES.length;
    if(preds.length<total){
      const faltanIds=GROUP_MATCHES.filter(m=>{
        const h=document.getElementById('h'+m.id)?.value, a=document.getElementById('a'+m.id)?.value;
        return h===''||a===''||h===null||a===null;
      });
      const grupos=[...new Set(faltanIds.map(m=>m.group))].join(', ');
      document.getElementById('saveMsg').innerHTML=`<div class="alert alert-warn">⚠️ Guardado ${preds.length}/${total} partidos. Te faltan ${total-preds.length} (Grupo${grupos.length>1?'s':''} ${grupos}). ¡Complétalos antes del bloqueo!</div>`;
    }else{
      document.getElementById('saveMsg').innerHTML=`<div class="alert alert-success">✅ ¡Guardado! ${total}/${total} partidos completos. Ve al bracket para ver tu simulación completa →</div>`;
    }
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(e){
    document.getElementById('saveMsg').innerHTML=`<div class="alert alert-error">❌ ${e.message}</div>`;
  }
  btn.disabled=false;btn.textContent='💾 Guardar predicciones';
}

function logout(){
  localStorage.removeItem('polla_p');
  window.location.href='index.html';
}
</script>
</body></html>
