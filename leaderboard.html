<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tabla · Polla Mundial 2026</title>
<link rel="stylesheet" href="css/style.css?v=1ec5797">
<style>
.lb-row{display:grid;grid-template-columns:36px 1fr 60px 60px 60px 60px 80px 65px;align-items:center;padding:10px 12px;border-radius:8px;margin-bottom:5px;background:var(--bg2);border:1px solid var(--border);cursor:pointer;transition:all .2s;font-size:.82rem;}
.lb-row:hover{border-color:var(--accent);}
.lb-header-row{display:grid;grid-template-columns:36px 1fr 60px 60px 60px 60px 80px 65px;padding:4px 12px;margin-bottom:4px;font-size:.72rem;color:var(--gray);}
.col-c{text-align:center;}
@media(max-width:700px){
  .lb-row,.lb-header-row{grid-template-columns:28px 1fr 50px 70px 55px;}
  .hide-mobile{display:none;}
}
</style>
</head><body>
<div class="hero" style="padding:22px">
  <h1 style="font-size:1.5rem">🏆 Tabla de Clasificación</h1>
  <p class="sub">Toca un nombre para ver el desglose completo</p>
</div>
<nav>
  <a href="#" onclick="logout()" style="color:var(--gray);font-size:.8rem">🚪 Salir</a>
  <a href="index.html">🏠 Inicio</a>
  <a href="predictions.html">✏️ Predicciones</a>
  <a href="bracket.html">🔱 Bracket</a>
  <a href="leaderboard.html" class="active">🏆 Tabla</a>
  <a href="rules.html">📋 Reglas</a>
</nav>
<div class="container">

  <div class="card">
    <h2>💰 Premio acumulado</h2>
    <div class="prize-grid">
      <div class="prize-item"><div class="prize-medal">🥇</div><div class="prize-lbl">1er lugar (65%)</div><div class="prize-amt" id="p1">—</div></div>
      <div class="prize-item"><div class="prize-medal">🥈</div><div class="prize-lbl">2do lugar (35%)</div><div class="prize-amt" id="p2">—</div></div>
    </div>
    <p class="text-gray text-center mt-8" style="font-size:.78rem" id="pNote">—</p>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2 style="margin:0">📊 Posiciones</h2>
      <button class="btn btn-sm btn-primary" onclick="load()">↻ Actualizar</button>
    </div>
    <div class="lb-header-row">
      <div>#</div>
      <div>PARTICIPANTE</div>
      <div class="col-c hide-mobile">GRUPOS</div>
      <div class="col-c hide-mobile">CLASIF.</div>
      <div class="col-c hide-mobile">ELIM F1</div>
      <div class="col-c hide-mobile">ELIM F2</div>
      <div class="col-c">TOTAL</div>
      <div class="col-c">PAGO</div>
    </div>
    <div id="lbContainer"><div class="loading"><div class="spinner"></div></div></div>
  </div>

  <div class="card" id="myCard" style="display:none">
    <h2>🎯 Tu posición</h2>
    <p id="myPos" class="text-gray" style="font-size:.9rem"></p>
  </div>
</div>

<!-- Modal desglose -->
<div class="modal-bg" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 id="modalTitle">Desglose</h2>
      <button onclick="document.getElementById('modal').classList.remove('open')" style="background:none;border:none;color:var(--gray);font-size:1.4rem;cursor:pointer">×</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/data.js?v=1ec5797"></script>
<script src="js/db.js?v=1ec5797"></script>
<script>
let myP=null, allParticipants=[], allResults=[];

window.addEventListener('DOMContentLoaded',async()=>{
  const saved=localStorage.getItem('polla_p');
  if(saved) myP=JSON.parse(saved);
  await load();
  setInterval(load,60000);
});

async function load(){
  try{
    [allParticipants,allResults]=await Promise.all([dbGetParticipants(),dbGetResults()]);
    renderLB();
    updatePrize();
  }catch(e){
    document.getElementById('lbContainer').innerHTML=`<div class="alert alert-error">Error: ${e.message}</div>`;
  }
}

function getBD(p){
  try{ return p.breakdown ? JSON.parse(p.breakdown) : null; }
  catch(e){ return null; }
}

function renderLB(){
  if(!allParticipants.length){
    document.getElementById('lbContainer').innerHTML='<p class="text-gray text-center" style="padding:24px">Aún no hay participantes</p>';
    return;
  }
  const medals=['🥇','🥈','🥉'];
  const rankCls=['g','s','b'];
  let html='';
  allParticipants.forEach((p,i)=>{
    const isMe=myP&&p.id===myP.id;
    const medal=i<3?medals[i]:i+1;
    const rc=i<3?rankCls[i]:'';
    const bd=getBD(p);
    const pg=bd?bd.pts_groups:0;
    const pc=bd?bd.pts_classify:0;
    const pe1=bd?bd.pts_elim_f1:0;
    const pe2=bd?bd.pts_elim_f2:0;
    html+=`<div class="lb-row" onclick="showBreakdown('${p.id}','${p.name}')" title="Ver desglose" style="${isMe?'border-color:var(--accent);background:#0a1e2e':''}">
      <div class="lb-rank ${rc}">${medal}</div>
      <div style="font-weight:600">${p.name}${isMe?' <span style="color:var(--accent);font-size:.7rem">← tú</span>':''}</div>
      <div class="col-c hide-mobile" style="color:var(--accent)">${pg}</div>
      <div class="col-c hide-mobile" style="color:var(--green)">${pc}</div>
      <div class="col-c hide-mobile" style="color:var(--gold)">${pe1}</div>
      <div class="col-c hide-mobile" style="color:var(--yellow)">${pe2}</div>
      <div class="col-c" style="font-weight:700;color:var(--gold);font-size:1rem">${p.total_points}</div>
      <div class="col-c lb-paid ${p.paid?'yes':'no'}">${p.paid?'✅ Pagó':'⏳ Pend.'}</div>
    </div>`;
  });
  document.getElementById('lbContainer').innerHTML=html;

  if(myP){
    const idx=allParticipants.findIndex(p=>p.id===myP.id);
    if(idx>=0){
      document.getElementById('myCard').style.display='block';
      const gap=idx>0?allParticipants[idx-1].total_points-allParticipants[idx].total_points:0;
      document.getElementById('myPos').innerHTML=
        `Estás en el <strong class="text-gold">puesto ${idx+1} de ${allParticipants.length}</strong> con <strong class="text-accent">${allParticipants[idx].total_points} pts</strong>. `+
        (idx>0?`Te separan <strong>${gap} pts</strong> del puesto ${idx}.`:'¡Vas primero! 🔥');
    }
  }
}

async function showBreakdown(pid,name){
  document.getElementById('modalTitle').innerHTML=`📊 ${name}`;
  document.getElementById('modalContent').innerHTML='<div class="loading"><div class="spinner"></div></div>';
  document.getElementById('modal').classList.add('open');

  try{
    // Traer resultados FRESCOS para que el desglose nunca quede desactualizado
    const [preds, freshResults]=await Promise.all([dbGetPredictions(pid), dbGetResults()]);
    allResults=freshResults;
    const resultMap={};
    allResults.forEach(r=>resultMap[r.match_id]={h:r.home_score,a:r.away_score});
    // Calcular clasificados reales igual que en el admin
    const realGroupScores={};
    allResults.filter(r=>r.match_id<=72).forEach(r=>{
      realGroupScores[r.match_id]={home:r.home_score,away:r.away_score};
    });
    const realGrouped=calcStandings(realGroupScores);
    const realClassifiedData=allResults.filter(r=>r.match_id<=72).length>=72
      ? getQualified(realGrouped) : null;
    const bd=calcAllPoints(preds,resultMap,realClassifiedData);

    const ptsCls=p=>p>0?'pos':p<0?'neg':'zero';
    const ptsTxt=p=>p>0?'+'+p:p===0?'0':p;

    const section=(title,rows,subtotal,color)=>{
      if(!rows.length&&subtotal===0) return `<div class="bd-section"><h3>${title} <span style="color:${color}">+0 pts</span></h3><p class="text-gray" style="font-size:.8rem;padding:4px 0">Sin resultados aún</p></div>`;
      let html=`<div class="bd-section"><h3>${title} <span style="color:${color}">${subtotal>=0?'+'+subtotal:subtotal} pts</span></h3>`;
      rows.forEach(r=>{
        const pts=r.pts||0;
        html+=`<div class="bd-row">
          <span>${r.label||''} <span class="text-gray" style="font-size:.75rem">${r.pred?`(pred: ${r.pred}${r.real?' · real: '+r.real:''})`:''}</span></span>
          <span class="bd-pts ${ptsCls(pts)}">${ptsTxt(pts)}</span>
        </div>`;
      });
      return html+'</div>';
    };

    // Partidos de grupo: organizados por grupo, con las siglas del cruce
    const groupSection=(rows,subtotal)=>{
      if(!rows.length) return `<div class="bd-section"><h3>⚽ Partidos de grupo <span style="color:var(--accent)">+0 pts</span></h3><p class="text-gray" style="font-size:.8rem;padding:4px 0">Sin resultados aún</p></div>`;
      const byGroup={};
      rows.forEach(r=>{ const m=MATCH_BY_ID[r.match_id]; if(!m)return; (byGroup[m.group]=byGroup[m.group]||[]).push({...r,m}); });
      let html=`<div class="bd-section"><h3>⚽ Partidos de grupo <span style="color:var(--accent)">${subtotal>=0?'+'+subtotal:subtotal} pts</span></h3>`;
      Object.keys(byGroup).sort().forEach(g=>{
        const sub=byGroup[g].reduce((a,r)=>a+(r.pts||0),0);
        html+=`<div style="display:flex;align-items:center;gap:6px;margin:8px 0 2px"><span class="grp g${g}" style="width:20px;height:20px;font-size:.7rem">${g}</span><span style="font-weight:700;font-size:.82rem">Grupo ${g}</span><span class="text-gray" style="font-size:.72rem;margin-left:auto">${sub>=0?'+'+sub:sub} pts</span></div>`;
        byGroup[g].forEach(r=>{
          const pts=r.pts||0;
          const ic=pts>=3?'✅':pts>0?'👍':'❌';
          html+=`<div class="bd-row" style="padding-left:6px">
            <span><span style="font-family:monospace;font-weight:700">${abbr(r.m.home)}–${abbr(r.m.away)}</span> ${ic}
              <span class="text-gray" style="font-size:.75rem">${r.pred?`(${r.pred} · real ${r.real})`:''}</span></span>
            <span class="bd-pts ${ptsCls(pts)}">${ptsTxt(pts)}</span>
          </div>`;
        });
      });
      return html+'</div>';
    };

    // Clasificación: cada fila con su grupo y la penalización detallada por equipo
    const classifySection=(rows,subtotal)=>{
      if(!rows.length&&subtotal===0) return `<div class="bd-section"><h3>📊 Clasificación de grupos <span style="color:var(--green)">+0 pts</span></h3><p class="text-gray" style="font-size:.8rem;padding:4px 0">Aún no termina la fase de grupos</p></div>`;
      let html=`<div class="bd-section"><h3>📊 Clasificación de grupos <span style="color:var(--green)">${subtotal>=0?'+'+subtotal:subtotal} pts</span></h3>`;
      rows.forEach(r=>{
        const pts=r.pts||0;
        if(r.group==='PENALIZACIÓN'){
          html+=`<div class="bd-row" style="border-top:1px solid var(--border);margin-top:4px;padding-top:8px">
            <span>⚠️ Equipos reales que clasificaron y <strong>no</strong> predijiste <span class="text-gray" style="font-size:.72rem">(−2 c/u)</span></span>
            <span class="bd-pts neg">${ptsTxt(pts)}</span></div>`;
          (r.details||[]).forEach(d=>{
            html+=`<div style="display:flex;justify-content:space-between;padding:2px 0 2px 16px;font-size:.78rem">
              <span class="text-gray">• ${d.team}</span><span class="bd-pts neg" style="font-size:.74rem">-2</span></div>`;
          });
        } else {
          const ic = pts>=10?'✅':pts===6?'🔄':pts>0?'👍':'❌';
          const txt = (r.label||'').replace(/^\S+\s/,''); // quitar emoji inicial del label
          html+=`<div class="bd-row">
            <span><span class="grp g${r.group}" style="width:20px;height:20px;font-size:.7rem;vertical-align:middle">${r.group}</span>
              ${ic} ${txt}
              <span class="text-gray" style="font-size:.72rem">${r.real1&&r.real1!=='?'?`(real: ${abbr(r.real1)}${r.real2&&r.real2!=='?'?'/'+abbr(r.real2):''})`:''}</span></span>
            <span class="bd-pts ${ptsCls(pts)}">${ptsTxt(pts)}</span></div>`;
        }
      });
      return html+'</div>';
    };

    // Eliminatorias F1: agrupado por ronda (equipos que predijiste que llegaban)
    const elimF1Section=(rows,subtotal)=>{
      if(!rows.length&&subtotal===0) return `<div class="bd-section"><h3>🔱 Eliminatorias Fase 1 <span style="color:var(--gold)">+0 pts</span></h3><p class="text-gray" style="font-size:.8rem;padding:4px 0">Aún no empiezan las eliminatorias</p></div>`;
      const byRound={};
      rows.forEach(r=>{ (byRound[r.round]=byRound[r.round]||[]).push(r); });
      let html=`<div class="bd-section"><h3>🔱 Eliminatorias Fase 1 <span style="color:var(--gold)">${subtotal>=0?'+'+subtotal:subtotal} pts</span></h3>
        <p class="text-gray" style="font-size:.72rem;padding:0 0 4px">Equipos que predijiste que llegaban a cada ronda y de verdad llegaron (sin importar el cruce)</p>`;
      ['Octavos','Cuartos','Semis','Final'].forEach(rd=>{
        if(!byRound[rd]) return;
        const sub=byRound[rd].reduce((a,r)=>a+(r.pts||0),0);
        const ok=byRound[rd].filter(r=>r.ok).length;
        html+=`<div style="display:flex;justify-content:space-between;align-items:center;background:var(--bg2);border-radius:6px;padding:6px 10px;margin-top:10px">
          <span style="font-weight:700;font-size:.82rem">🎟️ ${rd} <span class="text-gray" style="font-size:.72rem">(${ok}/${byRound[rd].length} llegaron)</span></span>
          <span style="font-size:.78rem;font-weight:700;color:${sub>=0?'var(--green)':'var(--red)'}">${sub>=0?'+'+sub:sub} pts</span></div>`;
        byRound[rd].forEach(r=>{
          html+=`<div class="bd-row" style="padding-left:6px">
            <span><span style="font-family:monospace;font-weight:700">${abbr(r.team)}</span> ${r.ok?'👍 llegó':'❌ no llegó'}</span>
            <span class="bd-pts ${ptsCls(r.pts)}">${ptsTxt(r.pts)}</span></div>`;
        });
      });
      return html+'</div>';
    };

    let html='';
    html+=groupSection(bd.group_matches,bd.pts_groups);
    html+=classifySection(bd.group_classify,bd.pts_classify);
    html+=elimF1Section(bd.elim_f1,bd.pts_elim_f1);
    html+=section('🔄 Eliminatorias Fase 2',bd.elim_f2,bd.pts_elim_f2,'var(--yellow)');
    if(bd.champion.length){
      html+=section('🏆 Campeón/Subcampeón',bd.champion,bd.pts_champion,'var(--gold)');
    }
    html+=`<div class="bd-total"><span>TOTAL</span><span class="text-gold">${bd.total} pts</span></div>`;
    document.getElementById('modalContent').innerHTML=html;
  }catch(e){
    document.getElementById('modalContent').innerHTML=`<div class="alert alert-error">Error: ${e.message}</div>`;
  }
}

function closeModal(e){if(e.target.id==='modal')document.getElementById('modal').classList.remove('open');}

function updatePrize(){
  const n=allParticipants.length,t=n*5;
  document.getElementById('p1').textContent='$'+Math.round(t*.65);
  document.getElementById('p2').textContent='$'+Math.round(t*.35);
  const paid=allParticipants.filter(p=>p.paid).length;
  document.getElementById('pNote').textContent=`${n} inscritos · ${paid} pagados · Bote confirmado: $${paid*5} USD`;
}

function logout(){
  localStorage.removeItem('polla_p');
  window.location.href='index.html';
}
</script>
</body></html>
